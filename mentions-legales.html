<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentions légales | PRO C2S</title>
    <meta name="description" content="Mentions légales du site PRO C2S : éditeur, hébergement, propriété intellectuelle et protection des données personnelles.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" type="image/png" href="image/logo.png.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .legal-wrap { max-width: 860px; margin: 0 auto; padding: 130px 20px 70px; text-align: left; }
        .legal-wrap h1 { font-size: 34px; color: #0f172a; margin-bottom: 10px; }
        .legal-wrap .legal-intro { color: #64748b; margin-bottom: 35px; line-height: 1.7; }
        .lang-switcher {
            display: flex;
            gap: 4px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.2);
        }
    </style>
</head>
<body>

<header id="main-header" class="scrolled">
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="image/logo.png.png" alt="PRO C2S"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Accueil</a></li>
            <li><a href="interim.html" data-i18n="nav_interim">Intérim</a></li>
            <li><a href="informatique.html" data-i18n="nav_info">Informatique</a></li>
            <li><a href="nettoyage.html" data-i18n="nav_clean">Nettoyage</a></li>
            <li><a href="index.html#contact" data-i18n="nav_contact">Contact</a></li>
        </ul>
        <div class="nav-actions" style="display: flex; align-items: center; gap: 12px;">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="fr">FR</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>
    </nav>
</header>

<main class="legal-wrap">
    <h1 data-i18n="leg_title">Mentions légales</h1>
    <p class="legal-intro" data-i18n="leg_intro">Conformément à la réglementation en vigueur au Maroc, les informations ci-dessous identifient l'éditeur du site et précisent les conditions d'utilisation de celui-ci.</p>
</main>

<footer>
    <div class="copyright" data-i18n="copyright">
        © 2026 PRO C2S - Tous droits réservés.
    </div>
</footer>

<script>
    const translations = {
        fr: {
            nav_home: "Accueil",
            nav_interim: "Intérim",
            nav_info: "Informatique",
            nav_clean: "Nettoyage",
            nav_contact: "Contact",
            leg_title: "Mentions légales",
            leg_intro: "Conformément à la réglementation en vigueur au Maroc, les informations ci-dessous identifient l'éditeur du site et précisent les conditions d'utilisation de celui-ci.",
            copyright: "© 2026 PRO C2S - Tous droits réservés."
        },
        en: {
            nav_home: "Home",
            nav_interim: "Temp Work",
            nav_info: "IT Services",
            nav_clean: "Cleaning",
            nav_contact: "Contact",
            leg_title: "Legal Notice",
            leg_intro: "In accordance with regulations in force in Morocco, the information below identifies the site publisher and specifies the terms of use.",
            copyright: "© 2026 PRO C2S - All rights reserved."
        }
    };

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const lang = btn.getAttribute('data-lang');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
        });
    });
</script>
</body>
</html>
